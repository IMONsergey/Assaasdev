name: Frontend checks

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: frontend-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  application:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - name: Save browser evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: browser-evidence
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 14
      - name: Save production assets
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: apcosys-dist-${{ github.sha }}
          path: dist/
          if-no-files-found: error
          retention-days: 14

  container:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - name: Build independent container
        run: docker build --pull --tag apcosys-ci .
      - name: Verify SPA, cookies, errors, streaming and WebSocket proxy
        run: |
          node deploy/smoke-upstream.mjs &
          apcosys_mock_pid=$!
          apcosys_cleanup() {
            apcosys_status=$?
            if [ "$apcosys_status" -ne 0 ]; then docker logs apcosys-ci || true; fi
            docker rm --force apcosys-ci >/dev/null 2>&1 || true
            kill "$apcosys_mock_pid" 2>/dev/null || true
            exit "$apcosys_status"
          }
          trap apcosys_cleanup EXIT
          docker run --detach --name apcosys-ci --network host --env APCOSYS_API_UPSTREAM=http://127.0.0.1:8091 --env APCOSYS_PUBLIC_SCHEME=http apcosys-ci
          node deploy/smoke-proxy.mjs

