# Include inside every API and OAuth callback location.
proxy_http_version 1.1;
proxy_set_header Upgrade $http_upgrade;
proxy_set_header Connection $apcosys_connection_upgrade;
proxy_set_header Host $apcosys_upstream_host;
proxy_set_header X-Real-IP $remote_addr;
proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Host $host;
proxy_set_header X-Forwarded-Proto $apcosys_public_scheme;
# Origin, Cookie and Set-Cookie are forwarded without weakening cookie attributes.
proxy_ssl_server_name on;
proxy_ssl_name $apcosys_tls_name;
proxy_ssl_verify on;
proxy_ssl_trusted_certificate /etc/ssl/certs/ca-certificates.crt;
proxy_ssl_verify_depth 3;
proxy_connect_timeout 10s;
proxy_read_timeout 3600s;
proxy_send_timeout 60s;
proxy_buffering off;
proxy_request_buffering off;
proxy_cache off;
proxy_intercept_errors off;
proxy_next_upstream off;

